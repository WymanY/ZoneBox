name: ZoneBox
options:
  minimumXcodeGenVersion: "2.45.0"
  bundleIdPrefix: com.fancyzone
  xcodeVersion: "15.4"
  projectFormat: xcode15_3
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    # Stable Apple Development signing so TCC (Accessibility) grants survive
    # rebuilds; ad-hoc signing changes the code signature on every build.
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "Apple Development"
    DEVELOPMENT_TEAM: A594W68DE5
    SWIFT_STRICT_CONCURRENCY: targeted
    GENERATE_INFOPLIST_FILE: NO
targets:
  ZoneBoxCore:
    type: library.static
    platform: macOS
    sources:
      - path: ZoneBox/Domain
        excludes:
          - ".gitkeep"
      - path: ZoneBox/Geometry
        excludes:
          - ".gitkeep"
      - path: ZoneBox/Services/Logging.swift
      - path: ZoneBox/Services/JSONCoding.swift
      - path: ZoneBox/Services/LayoutStore.swift
      - path: ZoneBox/Services/SettingsStore.swift
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.fancyzone.ZoneBoxCore
  ZoneBox:
    type: application
    platform: macOS
    sources:
      - path: ZoneBox
        excludes:
          - Domain/**
          - Geometry/**
          - Services/LayoutStore.swift
          - Services/SettingsStore.swift
          - Services/Logging.swift
          - Services/JSONCoding.swift
          - Resources/Info.plist
          - ZoneBox.entitlements
    dependencies:
      - target: ZoneBoxCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fancyzone.app
        PRODUCT_NAME: ZoneBox
        INFOPLIST_FILE: ZoneBox/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: ZoneBox/ZoneBox.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
        # Xcode 16+/26 Debug otherwise splits main into ZoneBox.debug.dylib;
        # launching outside the debugger never reaches AppDelegate.
        ENABLE_DEBUG_DYLIB: NO
  ZoneBoxTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: ZoneBoxTests
    dependencies:
      - target: ZoneBoxCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.fancyzone.ZoneBoxTests
        # No TEST_HOST. Logic tests only. No @testable import of the app.
schemes:
  ZoneBox:
    build:
      targets:
        ZoneBox: all
        ZoneBoxCore: [test]
        ZoneBoxTests: [test]
    test:
      targets:
        - ZoneBoxTests
